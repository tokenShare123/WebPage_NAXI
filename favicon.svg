<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
      <!-- 背景漸層：增加立體光感 -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10B981" />
        <stop offset="50%" stop-color="#059669" />
        <stop offset="100%" stop-color="#047857" />
      </linearGradient>
      
      <!-- 文字漸層：高光金屬感 -->
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#CBD5E1" />
      </linearGradient>

      <!-- 柔和陰影 -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#022c22" flood-opacity="0.4"/>
      </filter>
    </defs>

    <!-- 外框與背景圓形 -->
    <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" filter="url(#glow)" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5 3" />
    <circle cx="50" cy="50" r="36" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />

    <!-- 精修版幾何 "M" 字型路徑 -->
    <path d="M 28,67 
             V 35.5 
             L 33.5,31 
             L 50,52.5 
             L 66.5,31 
             L 72,35.5 
             V 67 
             H 63.5 
             V 45 
             L 50,62.5 
             L 36.5,45 
             V 67 
             Z" 
          fill="url(#textGrad)" />
</svg>
