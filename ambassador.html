<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTRAX (MTRX) Swap & Referral</title>
    <!-- Ethers.js CDN (v5.7.2) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- Font Awesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .connect-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .connect-btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .input-group {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            align-items: center;
        }

        input[type="number"], input[type="text"] {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.2rem;
            width: 100%;
            outline: none;
        }

        .action-btn {
            width: 100%;
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .status-box {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--accent);
            word-break: break-all;
        }

        .icon-btn {
            cursor: pointer;
            margin-left: 8px;
            color: var(--accent);
        }
        
        .icon-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">MTRAX Swap</div>
        <button id="connectBtn" class="connect-btn" onclick="initWallet()">連接錢包</button>
    </div>

    <!-- 合約地址設定 (隱藏或預設) -->
    <input type="hidden" id="contractAddress" value="0xYourContractAddressHere">

    <!-- 錢包與推薦資訊卡片 -->
    <div class="info-card">
        <div class="info-row">
            <span>目前錢包：</span>
            <span id="userAddress">未連接</span>
        </div>
        <div class="info-row">
            <span>推薦人 (Parent)：</span>
            <span id="parentAddressDisplay">無</span>
        </div>
        <div class="info-row">
            <span>我的推廣連結：</span>
            <span>
                <i class="fa-solid fa-share-nodes icon-btn" onclick="copyReferralLink()" title="複製推廣連結"></i> 點擊複製
            </span>
        </div>
    </div>

    <!-- Swap 介面 -->
    <div class="input-group">
        <div class="input-label">預計兌換的 MTRX 數量</div>
        <div class="input-row">
            <input type="number" id="mtrxAmountInput" placeholder="0.0" oninput="onAmountChange()">
            <span style="font-weight: bold; margin-left: 8px;">MTRX</span>
        </div>
    </div>

    <div class="input-group">
        <div class="input-label">預估需支付的 BNB 數量 (依 EXCHANGE_RATE 自動計算)</div>
        <div class="input-row">
            <input type="text" id="bnbAmountInput" placeholder="0.0" readonly>
            <span style="font-weight: bold; margin-left: 8px;">BNB</span>
        </div>
    </div>

    <button class="action-btn" id="swapActionBtn" onclick="handleSwap()">
        <span id="swapBtnText"><i class="fa-solid fa-bolt"></i> 立即兌換</span>
    </button>

    <div class="status-box" id="res_transitSwap"></div>
</div>

<script>
    // 預設配置
    const contractAddressDefault = "0xYourContractAddressHere"; // 請更換為你的 MTRAX 合約地址
    
    // 合約最小化 ABI (包含 swapMatrixWithAddr 與 EXCHANGE_RATE)
    const fullAbi = [
        "function EXCHANGE_RATE() view returns (uint256)",
        "function swapMatrixWithAddr(address parent) payable",
        "function swapBNB(uint256 matrixAmount)"
    ];

    // 全局變數
    let provider = null;
    let signer = null;
    let connectedAddress = null;
    let parentAddress = "0x0000000000000000000000000000000000000000"; // 預設零地址

    // 頁面加載時自動執行
    window.addEventListener('DOMContentLoaded', () => {
        // 1. 解析 URL 中的 parent 參數
        const urlParams = new URLSearchParams(window.location.search);
        const parentParam = urlParams.get('parent');
        
        if (parentParam && ethers.utils.isAddress(parentParam)) {
            parentAddress = parentParam;
            document.getElementById('parentAddressDisplay').innerText = 
                `${parentParam.substring(0, 6)}...${parentParam.substring(parentParam.length - 4)}`;
        }
        
        // 2. 檢測 MetaMask 狀態
        if (window.ethereum) {
            provider = new ethers.providers.Web3Provider(window.ethereum);
        }
    });

    // 初始化與連接錢包
    async function initWallet() {
        if (!window.ethereum) {
            alert("請安裝 MetaMask 或其他 Web3 錢包");
            return;
        }

        try {
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            connectedAddress = await signer.getAddress();
            
            // 更新 UI
            document.getElementById('connectBtn').innerText = 
                `${connectedAddress.substring(0, 6)}...${connectedAddress.substring(connectedAddress.length - 4)}`;
            document.getElementById('userAddress').innerText = 
                `${connectedAddress.substring(0, 6)}...${connectedAddress.substring(connectedAddress.length - 4)}`;
        } catch (err) {
            console.error("連接錢包失敗:", err);
            showResult('res_transitSwap', "連接錢包失敗: " + err.message);
        }
    }

    // 當使用者輸入預期 MTRX 數量時，自動計算需要的 BNB
    async function onAmountChange() {
        const mtrxInput = document.getElementById('mtrxAmountInput').value;
        const bnbInput = document.getElementById('bnbAmountInput');
        
        if (!mtrxInput || parseFloat(mtrxInput) <= 0) {
            bnbInput.value = "";
            return;
        }

        try {
            if (!provider) provider = new ethers.providers.Web3Provider(window.ethereum);
            
            const contractAddr = document.getElementById('contractAddress').value || contractAddressDefault;
            const contract = new ethers.Contract(contractAddr, fullAbi, provider);
            
            // 讀取合約 EXCHANGE_RATE
            const exchangeRate = await contract.EXCHANGE_RATE(); 
            
            // 計算：BNB(Wei) = MTRX(Wei) / EXCHANGE_RATE
            const mtrxWei = ethers.utils.parseEther(mtrxInput.toString());
            const bnbWei = mtrxWei.div(exchangeRate);
            
            bnbInput.value = ethers.utils.formatEther(bnbWei);
        } catch (err) {
            console.error("計算匯率失敗:", err);
            bnbInput.value = "計算錯誤";
        }
    }

    // 執行 Swap 兌換
    async function handleSwap() {
        const mtrxAmount = document.getElementById('mtrxAmountInput').value;
        
        if (!mtrxAmount || parseFloat(mtrxAmount) <= 0) {
            alert("請輸入有效的 MTRX 兌換數量");
            return;
        }

        try {
            if (!signer) await initWallet();

            showResult('res_transitSwap', "正在讀取匯率與準備交易...");

            const contractAddr = document.getElementById('contractAddress').value || contractAddressDefault;
            const contract = new ethers.Contract(contractAddr, fullAbi, signer);

            // 1. 取得最新匯率並計算應發送的 BNB (Wei)
            const exchangeRate = await contract.EXCHANGE_RATE(); 
            const mtrxWei = ethers.utils.parseEther(mtrxAmount.toString());
            const bnbWei = mtrxWei.div(exchangeRate);

            showResult('res_transitSwap', "請在錢包中確認交易...");

            // 2. 呼叫 swapMatrixWithAddr 並帶入 parent 與 BNB value
            const tx = await contract.swapMatrixWithAddr(parentAddress, { value: bnbWei });
            
            showResult('res_transitSwap', `交易已送出，等待區塊打包... Hash: ${tx.hash}`);
            await tx.wait();
            showResult('res_transitSwap', `兌換成功！交易 Hash: ${tx.hash}`);
        } catch (err) {
            console.error("Swap 執行失敗:", err);
            showResult('res_transitSwap', `兌換失敗: ${err.reason || err.message}`);
        }
    }

    // 複製帶有當前錢包地址的推薦連結
    async function copyReferralLink() {
        if (!connectedAddress) {
            alert("請先連接錢包以取得您的專屬推薦連結！");
            return;
        }
        
        const baseUrl = window.location.origin + window.location.pathname;
        const referralUrl = `${baseUrl}?parent=${connectedAddress}`;
        
        try {
            await navigator.clipboard.writeText(referralUrl);
            alert(`推廣連結已複製到剪貼簿：\n${referralUrl}`);
        } catch (err) {
            console.error("複製失敗:", err);
            alert(`複製失敗，請手動複製以下連結：\n${referralUrl}`);
        }
    }

    // 顯示訊息輔助函式
    function showResult(elementId, message) {
        document.getElementById(elementId).innerText = message;
    }
</script>
</body>
</html>
